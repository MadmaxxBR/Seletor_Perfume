  .wrap{max-width:520px;margin:0 auto;position:relative;z-index:1;}

  header{margin-bottom:26px;}
  .eyebrow-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;justify-content:space-between;}
  .brand-group{display:flex;align-items:center;gap:10px;}
  .glyph{width:30px;height:30px;flex:none;}
  .kicker{font-size:13px;color:var(--amber-deep);letter-spacing:0.02em;font-weight:600;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:33px;
    line-height:1.08;
    margin:2px 0 8px;
    color:var(--ink);
  }
  .sub{font-size:14.5px;color:#5c4a3a;line-height:1.5;max-width:42ch;}

  .lang-toggle{
    display:flex;
    flex:none;
    border:1px solid var(--line);
    border-radius:999px;
    overflow:hidden;
    background:var(--paper);
  }
  .lang-toggle button{
    border:none;
    background:transparent;
    padding:6px 11px;
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:600;
    color:#8a7561;
    cursor:pointer;
  }
  .lang-toggle button.active{
    background:var(--amber-deep);
    color:#fff8ee;
  }

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px;
    margin-bottom:16px;
    box-shadow:0 1px 0 rgba(255,255,255,0.6) inset, 0 10px 24px -18px rgba(58,30,10,0.5);
  }

  .field-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .field{flex:1;min-width:140px;}
  label{display:block;font-size:12.5px;color:var(--amber-deep);margin-bottom:6px;}
  input[type=number]{
    width:100%;
    font-family:'Fraunces',serif;
    font-size:22px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#fff;
    color:var(--ink);
  }
  input[type=number]:focus{outline:2px solid var(--amber-soft);outline-offset:1px;}

  .rain-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--ink);
    margin-top:12px;
    cursor:pointer;
  }
  .rain-toggle input{width:16px;height:16px;accent-color:var(--amber-deep);}

  .weather-status{
    font-size:12.5px;color:#8a7561;margin-top:8px;line-height:1.5;
  }
  .weather-status button{
    background:none;border:none;color:var(--amber-deep);text-decoration:underline;
    cursor:pointer;font-size:12.5px;padding:0;font-family:inherit;
  }

  .btn-main{
    width:100%;
    margin-top:16px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg, var(--amber-deep), var(--amber));
    color:#fff8ee;
    font-family:'Fraunces',serif;
    font-size:17px;
    letter-spacing:0.01em;
    cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow:0 8px 18px -10px rgba(122,59,18,0.7);
  }
  .btn-main:active{transform:scale(0.98);}

  .btn-alt{
    width:100%;
    margin-top:12px;
    padding:12px;
    border:1px solid var(--line);
    border-radius:12px;
    background:transparent;
    color:var(--amber-deep);
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-alt:active{transform:scale(0.98);}
  .btn-alt:disabled{opacity:0.5;cursor:default;}

  .result{display:none;}
  .result.show{display:block;}

  .result-card{
    background:linear-gradient(160deg, #3c2440, #241627);
    color:#f3e9d8;
    border-radius:20px;
    padding:26px 24px;
    position:relative;
    overflow:hidden;
  }
  .result-card::before{
    content:"";
    position:absolute;
    top:-40px;right:-40px;
    width:160px;height:160px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(226,164,92,0.35), transparent 70%);
  }
  .tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;position:relative;}
  .tag{
    font-size:11.5px;
    padding:4px 10px;
    border-radius:999px;
    border:1px solid rgba(243,233,216,0.35);
    color:#e2c9a0;
  }
  .tag.hero{background:rgba(226,164,92,0.18);border-color:rgba(226,164,92,0.5);color:#f0cf9c;}

  .perfume-name{
    font-family:'Fraunces',serif;
    font-size:28px;
    line-height:1.15;
    margin:0 0 4px;
    position:relative;
  }
  .perfume-brand{
    font-size:14px;
    color:#c9b596;
    margin:0 0 16px;
    position:relative;
  }
  .why{
    font-size:13.5px;
    line-height:1.6;
    color:#e6d9c2;
    border-top:1px solid rgba(243,233,216,0.2);
    padding-top:14px;
    position:relative;
  }
  .why b{color:#f0cf9c;font-weight:600;}

  .week-strip{display:flex;gap:6px;margin-top:14px;}
  .day-dot{flex:1;height:6px;border-radius:4px;background:rgba(243,233,216,0.15);}
  .day-dot.done{background:var(--amber-soft);}
  .day-dot.today{background:#fff;}

  .meta-line{font-size:12px;color:#8a7561;margin-top:14px;text-align:center;}

  .reset-link{
    display:block;
    text-align:center;
    font-size:12px;
    color:#8a7561;
    margin-top:22px;
    text-decoration:underline;
    cursor:pointer;
    background:none;border:none;
    width:100%;
  }

  .loading-line{font-size:13px;color:var(--amber-deep);}

  .history-panel{
    display:none;
    margin-top:14px;
    max-height:420px;
    overflow-y:auto;
    border-radius:16px;
    background:var(--paper);
    border:1px solid var(--line);
  }
  .history-panel.show{display:block;}
  .history-empty{padding:20px;text-align:center;font-size:13px;color:#8a7561;}
  .history-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
  }
  .history-row:last-child{border-bottom:none;}
  .history-date{font-size:11.5px;color:#8a7561;min-width:74px;line-height:1.3;}
  .history-date b{display:block;color:var(--amber-deep);font-size:13px;}
  .history-info{flex:1;min-width:0;}
  .history-name{
    font-family:'Fraunces',serif;
    font-size:15px;
    color:var(--ink);
    margin:0 0 2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .history-brand{font-size:11.5px;color:#8a7561;}
  .history-badge{
    font-size:10.5px;
    padding:3px 8px;
    border-radius:999px;
    white-space:nowrap;
    background:rgba(122,59,18,0.1);
    color:var(--amber-deep);
    border:1px solid rgba(122,59,18,0.18);
  }
  .history-badge.assinatura{background:rgba(60,36,64,0.1);color:var(--plum);border-color:rgba(60,36,64,0.2);}

  .tab-bar{
    display:flex;
    gap:6px;
    margin-bottom:18px;
    background:rgba(43,29,20,0.06);
    border-radius:12px;
    padding:4px;
  }
  .tab-btn{
    flex:1;
    padding:9px 0;
    border:none;
    border-radius:9px;
    background:transparent;
    color:#7a6851;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  .tab-btn.active{background:var(--paper);color:var(--amber-deep);box-shadow:0 1px 4px rgba(58,30,10,0.12);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  #addCard label{margin-top:10px;}
  #addCard label:first-child{margin-top:0;}
  #addCard input[type=text], #addCard select{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    padding:10px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#fff;
    color:var(--ink);
  }
  .add-actions{margin-top:10px;}
  .fragrantica-note{font-size:12px;color:#8a7561;line-height:1.5;margin:8px 0 4px;}
  .add-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .season-check{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;}
  .season-check label{
    display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;margin-top:0;
  }
  .season-check input{accent-color:var(--amber-deep);}
  .add-status{font-size:12.5px;color:var(--amber-deep);margin-top:8px;min-height:16px;}

  .collection-list{margin-top:16px;}
  .collection-item{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:10px;
  }
  .collection-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;cursor:pointer;}
  .collection-name{font-family:'Fraunces',serif;font-size:16px;margin:0;color:var(--ink);}
  .collection-brand{font-size:12px;color:#8a7561;margin:2px 0 0;}
  .collection-tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;}
  .collection-tag{
    font-size:10.5px;padding:2px 8px;border-radius:999px;
    background:rgba(122,59,18,0.08);color:var(--amber-deep);border:1px solid rgba(122,59,18,0.16);
  }
  .collection-actions{display:flex;gap:6px;flex:none;}
  .icon-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:12px;cursor:pointer;color:var(--ink);}
  .icon-btn.danger{color:#a02f1f;border-color:rgba(160,47,31,0.35);}
  .collection-edit{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
  .collection-edit.show{display:block;}

// universal storage adapter: uses Claude's window.storage when available,
// otherwise falls back to the browser's localStorage (GitHub Pages / PWA / APK)
const appStorage = (function(){
  if (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function') {
    return window.storage;
  }
  const PREFIX = 'essenceshelf:';
  return {
    async get(key){
      const raw = localStorage.getItem(PREFIX + key);
      if (raw === null) throw new Error('not found');
      return { key, value: raw };
    },
    async set(key, value){
      localStorage.setItem(PREFIX + key, value);
      return { key, value };
    },
    async delete(key){
      localStorage.removeItem(PREFIX + key);
      return { key, deleted: true };
    }
  };
})();

// ---------- collection management ("Collection" tab) ----------
const SEASON_OPTIONS = ['Spring', 'Summer', 'Autumn', 'Winter'];
const PERIOD_OPTIONS = ['Day', 'Night', 'Day and Night'];

  { value: 'regular', label: 'Regular' },

function computeAffinity(estacoes){
  const warm = new Set(['Spring','Summer']);
  const cool = new Set(['Autumn','Winter']);
  const isWarm = estacoes.every(s => warm.has(s));
  const isCool = estacoes.every(s => cool.has(s));
  if (isWarm) return 'warm';
  if (isCool) return 'cold';
  return 'transitional';
}

async function loadCollectionData(){
  let overrides = {}, removed = [], added = [];
  try{ const r = await appStorage.get('perfume-overrides', false); if (r && r.value) overrides = JSON.parse(r.value); }catch(e){}
  try{ const r = await appStorage.get('perfume-removed', false); if (r && r.value) removed = JSON.parse(r.value); }catch(e){}
  try{ const r = await appStorage.get('perfume-added', false); if (r && r.value) added = JSON.parse(r.value); }catch(e){}
  return { overrides, removed, added };
}

async function refreshPerfumes(){
  const { overrides, removed, added } = await loadCollectionData();
  const base = BASE_PERFUMES
    .filter(p => removed.indexOf(p.id) === -1)
    .map(p => overrides[p.id] ? Object.assign({}, p, overrides[p.id]) : p);
  PERFUMES = base.concat(added);
  return PERFUMES;
}

async function saveOverride(id, fields){
  const { overrides } = await loadCollectionData();
  overrides[id] = Object.assign({}, overrides[id] || {}, fields);
  try{ await appStorage.set('perfume-overrides', JSON.stringify(overrides), false); }catch(e){}
  await refreshPerfumes();
}

async function removePerfume(id){
  const { removed, added } = await loadCollectionData();
  // se for um perfume adicionado manualmente, remove direto da lista de adicionados
  const addedIdx = added.findIndex(p => p.id === id);
  if (addedIdx !== -1){
    added.splice(addedIdx, 1);
    try{ await appStorage.set('perfume-added', JSON.stringify(added), false); }catch(e){}
  } else if (removed.indexOf(id) === -1){
    removed.push(id);
    try{ await appStorage.set('perfume-removed', JSON.stringify(removed), false); }catch(e){}
  }
  await refreshPerfumes();
}

async function addPerfume(fields){
  const { added } = await loadCollectionData();
  const entry = {
    id: 'custom-' + Date.now(),
    nome: fields.nome, marca: fields.marca, periodo: fields.periodo,
    estacoes: fields.estacoes, afinidade: computeAffinity(fields.estacoes),
    categoria: fields.categoria
  };
  added.push(entry);
  try{ await appStorage.set('perfume-added', JSON.stringify(added), false); }catch(e){}
  await refreshPerfumes();
  return entry;
}


// ---------- date / season helpers (southern hemisphere) ----------
function pad(n){return n<10?'0'+n:''+n;}

function getSeason(date, isRaining){
  if (isRaining) return 'Winter'; // a rainy day counts as Winter in the pick
  const m = date.getMonth()+1, d = date.getDate();
  const md = m*100+d;
  if (md >= 1221 || md <= 320) return 'Summer';
  if (md >= 321 && md <= 620) return 'Autumn';
  if (md >= 621 && md <= 922) return 'Winter';
  return 'Spring';
}

function isoWeekKey(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7; // segunda=0
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(),0,4));
  const week = 1 + Math.round(((d - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay()+6)%7)) / 7);
  return d.getUTCFullYear() + '-W' + pad(week);
}

function isoWeekdayMon0(date){
  return (date.getDay() + 6) % 7; // segunda=0 ... domingo=6
}

function dateKey(date){
  return date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate());
}

// ---------- deterministic PRNG by seed (date) ----------
function seededRandom(seedStr){
  let h = 0;
  for (let i=0;i<seedStr.length;i++){ h = Math.imul(31,h) + seedStr.charCodeAt(i) | 0; }
  return function(){
    h = Math.imul(h ^ (h >>> 15), h | 1);
    h ^= h + Math.imul(h ^ (h >>> 7), h | 61);
    return ((h ^ (h >>> 14)) >>> 0) / 4294967296;
  };
}
function pickSeeded(arr, seedStr){
  if (arr.length === 0) return null;
  const rnd = seededRandom(seedStr);
  return arr[Math.floor(rnd() * arr.length)];
}

}

}
async function loadTodayPick(dKey){
  try{
    const res = await appStorage.get('pick:'+dKey, false);
    if (res && res.value) return JSON.parse(res.value);
  }catch(e){}
  return null;
}
async function saveTodayPick(dKey, payload){
  try{ await appStorage.set('pick:'+dKey, JSON.stringify(payload), false); }catch(e){}

async function appendHistory(payload){
  let list = [];
  try{
    const res = await appStorage.get('history-log', false);
    if (res && res.value) list = JSON.parse(res.value);
  }catch(e){}
  const entry = {
    id: payload.dateKey + '-' + Date.now() + '-' + Math.floor(Math.random()*1000),
    ts: Date.now(),
    dateKey: payload.dateKey, weekKey: payload.weekKey,
    nome: payload.perfume.nome, marca: payload.perfume.marca,
    reasonTag: payload.reasonTag, manual: !!payload.manual,
    temp: payload.temp, hot: payload.hot, isRaining: !!payload.isRaining,
    season: payload.season, period: payload.period
  };
  list.push(entry); // always append — never replace a previous pick from the same day
  list.sort((a,b) => b.ts - a.ts);
  if (list.length > 200) list = list.slice(0, 200);
  try{ await appStorage.set('history-log', JSON.stringify(list), false); }catch(e){}
}

// ---------- selection logic ----------
function isHot(temp){ return temp > 22; }

// daytime: 5:00am–4:59pm · nighttime: 5:00pm–4:59am
function getCurrentPeriod(date){
  const hour = date.getHours();
  return (hour >= 5 && hour < 17) ? 'Day' : 'Night';
}

function eligiblePool(temp, period){
  const hot = isHot(temp);
  const wantAffin = hot ? 'warm' : 'cold';
  return PERFUMES.filter(p=>{
    const periodoOk = (p.periodo === period || p.periodo === 'Day and Night');
    const affinOk = (p.afinidade === wantAffin || p.afinidade === 'transitional');
    return periodoOk && affinOk;
  });
}

function seasonMatch(p, season){
  return p.estacoes.indexOf(season) !== -1;
}

function excludeName(arr, name){
  if (!name) return arr;
  const filtered = arr.filter(p => p.nome !== name);
  return filtered.length ? filtered : arr; // only keeps the repeat if it's the only possible option
}

async function chooseTodayPerfume(temp, isRaining){
  const now = new Date();
  const dKey = dateKey(now);
  const wKey = isoWeekKey(now);
  const weekdayIdx = isoWeekdayMon0(now); // 0=seg ... 6=dom
  const season = getSeason(now, isRaining);
  const hot = isHot(temp);
  const period = getCurrentPeriod(now);

  // if there's already a saved pick for today in the same week, same rain condition AND same period (day/night), reuse it
  const existing = await loadTodayPick(dKey);
  if (existing && existing.weekKey === wKey && existing.temp === temp && !!existing.isRaining === !!isRaining && existing.period === period) {
    return existing;
  }

  // yesterday's perfume — avoids repeating even across a week boundary
  const yesterday = new Date(now.getTime() - 86400000);
  const yPick = await loadTodayPick(dateKey(yesterday));
  const lastName = yPick && yPick.perfume ? yPick.perfume.nome : null;

  let state = await loadWeekState(wKey);
  const pool = eligiblePool(temp, period);

  const assinatura = pool.find(p => p.categoria === 'signature');
  let favoritosPool = pool.filter(p => p.categoria === 'favorite' && state.usedNames.indexOf(p.nome) === -1);
  let regularPool = pool.filter(p => p.categoria !== 'signature' && state.usedNames.indexOf(p.nome) === -1);
  favoritosPool = excludeName(favoritosPool, lastName);
  regularPool = excludeName(regularPool, lastName);

  let chosen = null;
  let reasonTag = 'regular';

  // 1) signature: target Wednesday (idx 2), forced through Sunday (idx 6) if still unused
  //    never repeats if it was yesterday's perfume, even if the weekly state is inconsistent
  const signatureWasYesterday = assinatura && lastName === assinatura.nome;
  if (!state.signatureUsed && assinatura && weekdayIdx >= 2 && !signatureWasYesterday) {
    chosen = assinatura;
    reasonTag = 'signature';
  }
  // self-heal: if yesterday was already the signature THIS SAME week but the state didn't record it, fix it now
  if (signatureWasYesterday && yPick && yPick.weekKey === wKey && !state.signatureUsed) {
    state.signatureUsed = true;
  }

  if (yPick && yPick.reasonTag === 'favorite' && yPick.weekKey === wKey && state.favoriteCount === 0) {
    state.favoriteCount = 1; // self-heal: yesterday already counted as this week's favorite
  }

  // 2) favorite: target Saturday (idx 5), forced on Sunday (idx 6) if still no favorite
  if (!chosen && state.favoriteCount === 0 && weekdayIdx >= 5) {
    const seasonFavs = favoritosPool.filter(p => seasonMatch(p, season));
    const favChoice = seasonFavs.length ? seasonFavs : favoritosPool;
    chosen = pickSeeded(favChoice, dKey+'-fav') || pickSeeded(excludeName(PERFUMES.filter(p=>p.categoria==='favorite'), lastName), dKey+'-fav-fallback');
    reasonTag = 'favorite';
  }

  // 3) organic chance of pulling in a favorite even before the target day (keeps the routine lively)
  if (!chosen && favoritosPool.length) {
    const rnd = seededRandom(dKey+'-favchance');
    const seasonFavs = favoritosPool.filter(p => seasonMatch(p, season));
    if (rnd() < 0.35 && (seasonFavs.length || favoritosPool.length)) {
      chosen = pickSeeded(seasonFavs.length ? seasonFavs : favoritosPool, dKey+'-favpick');
      reasonTag = 'favorite';
    }
  }

  // 4) regular rotation, prioritizing the current season
  if (!chosen) {
    let candidates = regularPool.filter(p => seasonMatch(p, season));
    if (!candidates.length) candidates = regularPool;
    if (!candidates.length) {
      // week exhausted: reset rotation (minus signature/favorite already counted)
      state.usedNames = [];
      candidates = pool.filter(p => p.categoria !== 'signature' && seasonMatch(p, season));
      if (!candidates.length) candidates = pool.filter(p => p.categoria !== 'signature');
      candidates = excludeName(candidates, lastName);
    }
    chosen = pickSeeded(candidates, dKey+'-reg');
    reasonTag = chosen && chosen.categoria === 'favorite' ? 'favorite' : 'regular';
  }

  if (!chosen) {
    // absolute fallback: any perfume from the current period, avoiding yesterday's repeat if possible
    const periodPerfumes = PERFUMES.filter(p => p.periodo === period || p.periodo === 'Day and Night');
    const anyPeriodPerfume = excludeName(periodPerfumes.length ? periodPerfumes : PERFUMES, lastName);
    chosen = anyPeriodPerfume[0] || PERFUMES[0];
    reasonTag = 'regular';
  }

  // atualiza estado
  if (reasonTag === 'signature') state.signatureUsed = true;
  if (reasonTag === 'favorite') state.favoriteCount += 1;
  if (state.usedNames.indexOf(chosen.nome) === -1) state.usedNames.push(chosen.nome);
  await saveWeekState(wKey, state);

  const payload = {
    weekKey: wKey, dateKey: dKey, temp, hot, season, weekdayIdx, isRaining: !!isRaining, period,
    perfume: chosen, reasonTag,
    signatureUsed: state.signatureUsed, favoriteCount: state.favoriteCount,
    usedCount: state.usedNames.length
  };
  await saveTodayPick(dKey, payload);
  return payload;
}

// manual swap: discards today's current pick and rolls another, without repeating today's or yesterday's
async function pickAlternative(currentPayload, temp, isRaining){
  const now = new Date();
  const dKey = dateKey(now);
  const wKey = isoWeekKey(now);
  const weekdayIdx = isoWeekdayMon0(now);
  const season = getSeason(now, isRaining);
  const hot = isHot(temp);
  const period = getCurrentPeriod(now);

  const yesterday = new Date(now.getTime() - 86400000);
  const yPick = await loadTodayPick(dateKey(yesterday));
  const lastName = yPick && yPick.perfume ? yPick.perfume.nome : null;

  let state = await loadWeekState(wKey);

  // revert the current pick's contribution, if it belongs to this same week
  if (currentPayload && currentPayload.weekKey === wKey) {
    if (currentPayload.reasonTag === 'signature') state.signatureUsed = false;
    if (currentPayload.reasonTag === 'favorite') state.favoriteCount = Math.max(0, state.favoriteCount - 1);
    const idx = state.usedNames.indexOf(currentPayload.perfume.nome);
    if (idx !== -1) state.usedNames.splice(idx, 1);
  }

  const excludeToday = currentPayload && currentPayload.perfume ? currentPayload.perfume.nome : null;

  let pool = eligiblePool(temp, period);
  pool = excludeName(pool, excludeToday);
  pool = excludeName(pool, lastName);

  let candidates = pool.filter(p => seasonMatch(p, season));
  if (!candidates.length) candidates = pool;
  if (!candidates.length) {
    const periodPerfumes = PERFUMES.filter(p => p.periodo === period || p.periodo === 'Day and Night');
    candidates = excludeName(periodPerfumes.length ? periodPerfumes : PERFUMES, excludeToday);
  }

  // click counter for the day, to vary the suggestion on each swap
  let altCount = 0;
  try{
    const c = await appStorage.get('alt-count:'+dKey, false);
    altCount = c && c.value ? parseInt(c.value, 10) : 0;
  }catch(e){}
  altCount += 1;
  try{ await appStorage.set('alt-count:'+dKey, String(altCount), false); }catch(e){}

  const chosen = pickSeeded(candidates, dKey + '-alt-' + altCount) || candidates[0] || PERFUMES[0];
  const reasonTag = chosen.categoria === 'signature' ? 'signature' : chosen.categoria === 'favorite' ? 'favorite' : 'regular';

  if (reasonTag === 'signature') state.signatureUsed = true;
  if (reasonTag === 'favorite') state.favoriteCount += 1;
  if (state.usedNames.indexOf(chosen.nome) === -1) state.usedNames.push(chosen.nome);
  await saveWeekState(wKey, state);

  const payload = {
    weekKey: wKey, dateKey: dKey, temp, hot, season, weekdayIdx, isRaining: !!isRaining, period,
    perfume: chosen, reasonTag, manual: true,
    signatureUsed: state.signatureUsed, favoriteCount: state.favoriteCount,
    usedCount: state.usedNames.length
  };
  await saveTodayPick(dKey, payload);
  return payload;
}

async function setLanguage(lang){
  LANG = lang;
  try{ await appStorage.set('lang', lang, false); }catch(e){}
  applyStaticText();
  if (currentPayload) renderResult(currentPayload);
  const historyPanel = document.getElementById('historyPanel');
  if (historyPanel.classList.contains('show')){
    const list = await loadHistory();
    renderHistory(list);
  }
  if (document.getElementById('tabColecao').classList.contains('active')){
    renderCollectionList();
  }
}

async function loadLanguagePref(){
  try{
    const r = await appStorage.get('lang', false);
    if (r && r.value) return r.value;
  }catch(e){}
  return 'pt';
}

// ---------- day labels ----------
function formatHistoryDate(dKey){
  const [y,m,d] = dKey.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return { dayMonth: pad(d)+'/'+pad(m), weekday: t('weekdayShort')[dt.getDay()] };
}

function renderResult(payload){
  const { perfume, reasonTag, hot, season, weekdayIdx, signatureUsed, favoriteCount, isRaining, period } = payload;

  document.getElementById('perfumeName').textContent = perfume.nome;
  document.getElementById('perfumeBrand').textContent = perfume.marca;

  const tagRow = document.getElementById('tagRow');
  const heroLabel = reasonTag === 'signature' ? t('heroSignature')
                    : reasonTag === 'favorite' ? t('heroFavorite')
                    : t('heroRegular');
  tagRow.innerHTML = `
    ${payload.manual ? `<span class="tag">${t('manualTag')}</span>` : ''}
    <span class="tag hero">${heroLabel}</span>
    <span class="tag">${period === 'Night' ? t('nightPeriodTag') : t('dayPeriodTag')}</span>
    <span class="tag">${L('affinity', hot ? 'warm' : 'cold')} \u00b7 ${payload.temp}\u00b0C</span>
    <span class="tag">${L('season', season)}${isRaining ? t('rainSuffix') : ''}</span>
  `;

  const seasonNote = perfume.estacoes.indexOf(season) !== -1
    ? t('seasonMatchNote')(L('season', season))
    : t('seasonVersatileNote')(seasonListLabel(perfume.estacoes));

  const periodNote = period === 'Night' ? t('nightPeriodNote') : t('dayPeriodNote');
  const warmCold = L('affinity', hot ? 'warm' : 'cold').toLowerCase();
  const rainPart = isRaining ? t('rainPart') : '';
  let why = t('whyText')(periodNote, warmCold, payload.temp, rainPart, seasonNote);
  if (reasonTag === 'signature') why += t('signatureExtra');
  if (reasonTag === 'favorite') why += t('favoriteExtra');

  document.getElementById('whyText').innerHTML = why;

  const strip = document.getElementById('weekStrip');
  strip.innerHTML = '';
  t('dayLabels').forEach((label, i)=>{
    const dot = document.createElement('div');
    dot.className = 'day-dot' + (i < weekdayIdx ? ' done' : '') + (i === weekdayIdx ? ' today' : '');
    strip.appendChild(dot);
  });

  document.getElementById('metaLine').textContent = t('metaLine')(signatureUsed, favoriteCount);

  document.getElementById('resultBlock').classList.add('show');
}

let currentPayload = null;

async function runPick(){
  const btn = document.getElementById('pickBtn');
  btn.textContent = t('picking');
  btn.disabled = true;
  const temp = parseFloat(document.getElementById('tempInput').value) || 24;
  const isRaining = document.getElementById('rainInput').checked;
  try{
    const payload = await chooseTodayPerfume(temp, isRaining);
    currentPayload = payload;
    renderResult(payload);
  } finally {
    btn.textContent = t('pickBtn');
    btn.disabled = false;
  }
}

async function runAlternative(){
  const btn = document.getElementById('altBtn');
  btn.textContent = t('swapping');
  btn.disabled = true;
  const temp = parseFloat(document.getElementById('tempInput').value) || 24;
  const isRaining = document.getElementById('rainInput').checked;
  try{
    const payload = await pickAlternative(currentPayload, temp, isRaining);
    currentPayload = payload;
    renderResult(payload);
  } finally {
    btn.textContent = t('altBtn');
    btn.disabled = false;
  }
}

document.getElementById('pickBtn').addEventListener('click', runPick);
document.getElementById('altBtn').addEventListener('click', runAlternative);

document.getElementById('resetLink').addEventListener('click', async ()=>{
  const now = new Date();
  const wKey = isoWeekKey(now);
  try{
    await appStorage.set('week-state:'+wKey, JSON.stringify({usedNames:[], signatureUsed:false, favoriteCount:0}), false);
    await appStorage.delete('pick:'+dateKey(now), false);
    await appStorage.delete('alt-count:'+dateKey(now), false);
  }catch(e){}
  currentPayload = null;
  document.getElementById('resultBlock').classList.remove('show');
  document.getElementById('weatherStatusText').textContent = t('resetDone');
});

document.getElementById('manualBtn').addEventListener('click', ()=>{
  document.getElementById('weatherStatusText').textContent = t('manualModeTemp');
});

// ---------- history ----------
function renderHistory(list){
  const panel = document.getElementById('historyPanel');
  if (!list.length){
    panel.innerHTML = `<div class="history-empty">${t('noHistory')}</div>`;
    return;
  }
  panel.innerHTML = list.map(entry=>{
    const { dayMonth, weekday } = formatHistoryDate(entry.dateKey);
    const badgeLabel = entry.reasonTag === 'signature' ? t('badgeSignature')
                      : entry.reasonTag === 'favorite' ? t('badgeFavorite')
                      : t('badgeRegular');
    const badgeClass = entry.reasonTag === 'signature' ? 'history-badge assinatura' : 'history-badge';
    const manualNote = entry.manual ? t('manualSwap') : '';
    const periodWord = entry.period === 'Night' ? t('nightWord') : t('dayWord');
    const warmCold = L('affinity', entry.hot ? 'warm' : 'cold').toLowerCase();
    return `
      <div class="history-row">
        <div class="history-date"><b>${dayMonth}</b>${weekday}</div>
        <div class="history-info">
          <p class="history-name">${entry.nome}</p>
          <p class="history-brand">${entry.marca} \u00b7 ${periodWord} \u00b7 ${warmCold} ${entry.temp}\u00b0C${entry.isRaining ? t('rainHistorySuffix') : ''}${manualNote}</p>
        </div>
        <span class="${badgeClass}">${badgeLabel}</span>
      </div>`;
  }).join('');
}

document.getElementById('historyToggle').addEventListener('click', async ()=>{
  const panel = document.getElementById('historyPanel');
  const isShown = panel.classList.contains('show');
  if (isShown){
    panel.classList.remove('show');
    return;
  }
  panel.innerHTML = `<div class="history-empty">${t('loadingHistory')}</div>`;
  panel.classList.add('show');
  const list = await loadHistory();
  renderHistory(list);
});

// ---------- auto weather ----------
async function tryAutoWeather(){
  const statusEl = document.getElementById('weatherStatusText');
  const wrapEl = document.getElementById('weatherStatus');
  if (!navigator.geolocation) {
    statusEl.textContent = t('autoDetectUnavailable');
    return;
  }
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    try{
      const { latitude, longitude } = pos.coords;
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,precipitation,weather_code`;
      const res = await fetch(url);
      const data = await res.json();
      const cur = data && data.current;
      const temp = cur && cur.temperature_2m;
      const precip = cur && cur.precipitation;
      const code = cur && cur.weather_code;
      const rainCodes = new Set([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99]);
      const raining = (typeof precip === 'number' && precip > 0) || rainCodes.has(code);

      if (typeof temp === 'number'){
        document.getElementById('tempInput').value = Math.round(temp);
        document.getElementById('rainInput').checked = !!raining;
        const rainWord = raining ? t('rainWordYes') : t('rainWordNo');
        wrapEl.innerHTML = `<span id="weatherStatusText">${t('autoDetected')(Math.round(temp), rainWord)}</span> <button id="manualBtn2" type="button">${t('adjustManually')}</button>`;
        document.getElementById('manualBtn2').addEventListener('click', ()=>{
          document.getElementById('weatherStatusText').textContent = t('manualModeBoth');
        });
      } else {
        throw new Error('no temperature data');
      }
    }catch(e){
      statusEl.textContent = t('autoFailed');
    }
  }, ()=>{
    statusEl.textContent = t('locationDenied');
  }, { timeout: 6000 });
}

tryAutoWeather();

// ---------- collection tab: listing, edit, remove ----------
function seasonCheckboxesHtml(name, selected){
  return SEASON_OPTIONS.map(s => `
    <label><input type="checkbox" data-season="${s}" ${selected.indexOf(s) !== -1 ? 'checked' : ''}> ${L('season', s)}</label>
  `).join('');
}
function periodOptionsHtml(selected){
  return PERIOD_OPTIONS.map(p => `<option value="${p}" ${p === selected ? 'selected' : ''}>${L('period', p)}</option>`).join('');
}
function categoryOptionsHtml(selected){
  return CATEGORY_OPTIONS.map(c => `<option value="${c.value}" ${c.value === selected ? 'selected' : ''}>${L('category', c.value)}</option>`).join('');
}

function renderCollectionList(){
  const container = document.getElementById('collectionList');
  if (!PERFUMES.length){
    container.innerHTML = `<div class="history-empty">${t('noCollection')}</div>`;
    return;
  }
  const sorted = PERFUMES.slice().sort((a,b)=> a.nome.localeCompare(b.nome, 'pt-BR'));
  container.innerHTML = sorted.map(p => `
    <div class="collection-item" data-id="${p.id}">
      <div class="collection-head" data-toggle="${p.id}">
        <div>
          <p class="collection-name">${p.nome}</p>
          <p class="collection-brand">${p.marca}</p>
          <div class="collection-tags">
            <span class="collection-tag">${L('period', p.periodo)}</span>
            <span class="collection-tag">${seasonListLabel(p.estacoes)}</span>
            <span class="collection-tag">${L('category', p.categoria)}</span>
          </div>
        </div>
        <div class="collection-actions">
          <button class="icon-btn" data-edit="${p.id}" type="button">${t('editBtn')}</button>
          <button class="icon-btn danger" data-remove="${p.id}" type="button">${t('removeBtn')}</button>
        </div>
      </div>
      <div class="collection-edit" id="edit-${p.id}">
        <label>${t('nameLabel')}</label>
        <input type="text" id="editNome-${p.id}" value="${p.nome.replace(/"/g,'&quot;')}">
        <div class="edit-grid">
          <div>
            <label>${t('brandLabel')}</label>
            <input type="text" id="editMarca-${p.id}" value="${p.marca.replace(/"/g,'&quot;')}">
          </div>
          <div>
            <label>${t('periodLabel')}</label>
            <select id="editPeriodo-${p.id}">${periodOptionsHtml(p.periodo)}</select>
          </div>
        </div>
        <label>${t('seasonsLabel')}</label>
        <div class="season-check" id="editSeasons-${p.id}">${seasonCheckboxesHtml(p.id, p.estacoes)}</div>
        <label>${t('categoryLabel')}</label>
        <select id="editCategoria-${p.id}">${categoryOptionsHtml(p.categoria)}</select>
        <div class="save-row">
          <button class="btn-main" data-save="${p.id}" type="button">${t('saveChanges')}</button>
        </div>
      </div>
    </div>
  `).join('');

  container.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-toggle');
      document.getElementById('edit-'+id).classList.toggle('show');
    });
  });
  container.querySelectorAll('[data-edit]').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const id = el.getAttribute('data-edit');
      document.getElementById('edit-'+id).classList.toggle('show');
    });
  });
  container.querySelectorAll('[data-remove]').forEach(el=>{
    el.addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      const id = el.getAttribute('data-remove');
      const item = container.querySelector(`.collection-item[data-id="${id}"]`);
      const nome = item ? item.querySelector('.collection-name').textContent : '';
      if (!confirm(t('confirmRemove')(nome))) return;
      await removePerfume(id);
      renderCollectionList();
    });
  });
  container.querySelectorAll('[data-save]').forEach(el=>{
    el.addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      const id = el.getAttribute('data-save');
      const nome = document.getElementById('editNome-'+id).value.trim();
      const marca = document.getElementById('editMarca-'+id).value.trim();
      const periodo = document.getElementById('editPeriodo-'+id).value;
      const categoria = document.getElementById('editCategoria-'+id).value;
      const seasonBoxes = document.querySelectorAll('#editSeasons-'+id+' input[data-season]');
      const estacoes = Array.from(seasonBoxes).filter(b=>b.checked).map(b=>b.getAttribute('data-season'));
      if (!nome || !marca || estacoes.length === 0){
        alert(t('fillRequired'));
        return;
      }
      const afinidade = computeAffinity(estacoes);
      await saveOverride(id, { nome, marca, periodo, categoria, estacoes, afinidade });
      renderCollectionList();
    });
  });
}

document.getElementById('fragranticaBtn').addEventListener('click', ()=>{

document.getElementById('addPerfumeBtn').addEventListener('click', async ()=>{
  const nome = document.getElementById('addNome').value.trim();
  const marca = document.getElementById('addMarca').value.trim();
  const periodo = document.getElementById('addPeriodo').value;
  const categoria = document.getElementById('addCategoria').value;
  const seasonBoxes = document.querySelectorAll('#addSeasons input[type=checkbox]');
  const estacoes = Array.from(seasonBoxes).filter(b=>b.checked).map(b=>b.value);
  const statusEl = document.getElementById('addStatus');

  if (!nome || !marca || estacoes.length === 0){
    statusEl.textContent = t('fillRequired');
    return;
  }

  await addPerfume({ nome, marca, periodo, categoria, estacoes });
  statusEl.textContent = t('addedTo')(nome);

  document.getElementById('addNome').value = '';
  document.getElementById('addMarca').value = '';
  document.getElementById('addPeriodo').value = 'Day and Night';
  document.getElementById('addCategoria').value = 'regular';
  seasonBoxes.forEach(b => b.checked = false);

  renderCollectionList();
});

    sw.style.display = 'block';
    sw.textContent = t('storageWarning');

}
